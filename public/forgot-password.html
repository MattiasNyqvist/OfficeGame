<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | OfficeGame</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="container mt-5">
    <div class="form-container">
        <h2 class="text-center">Reset Your Password</h2>

        <!-- Alert Box for Messages -->
        <div id="alertBox" class="alert d-none"></div>

        <form id="forgotPasswordForm">
            <div class="mb-3">
                <label for="email" class="form-label">Enter your email <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a href="login.html" class="btn btn-secondary">Back to Login</a>
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/forgot-password.js"></script>
</body>
</html>
