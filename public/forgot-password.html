<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | OfficeGame</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <div class="auth-brand" aria-label="OfficeGame">
            <span class="brand-mark"><i class="bi bi-grid-3x3-gap-fill"></i></span>
            <span>OfficeGame</span>
        </div>
        <div class="form-container">
        <h1 class="auth-heading">Forgot your password?</h1>
        <p class="auth-subtitle">Enter your email and we'll send reset instructions.</p>

        <!-- Alert Box for Messages -->
        <div id="alertBox" class="alert d-none"></div>

        <form id="forgotPasswordForm">
            <div class="mb-3">
                <label for="email" class="form-label">Enter your email <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="auth-actions">
                <a href="login.html" class="btn btn-secondary">Back to Login</a>
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </div>
        </form>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/forgot-password.js"></script>
</body>
</html>
